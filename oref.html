<!DOCTYPE html>
<html lang="he" dir="rtl" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצב התראות בזמן אמת</title>
    <!-- Dynamic Favicon Link - Using encoded SVG circle to prevent clipping -->
    <link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%2310b981' stroke='black' stroke-width='2'/%3E%3C/svg%3E">
    
    <!-- Google Fonts: Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        body {
            transition: background-color 0.8s ease, color 0.3s ease;
            margin: 0;
            padding: 0; 
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center; 
            justify-content: center;
            font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
            overflow: hidden !important; 
            touch-action: none;
            background-color: #111; 
        }
        
        #mainWrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Responsive Split Screen */
        @media (max-aspect-ratio: 1/1), (max-width: 768px) {
            #mainWrapper {
                flex-direction: column;
            }
        }
        
        .view-half {
            flex: 1 1 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding: 1.5rem;
            padding-top: 6vh; 
            position: relative;
            height: 100%;
            transition: flex 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        opacity 0.6s ease, 
                        background-color 0.8s ease;
            overflow: hidden;
        }
        
        .view-half.collapsed {
            flex: 0 0 0%;
            opacity: 0;
            padding: 0;
            pointer-events: none;
        }

        .status-container {
            text-align: center;
            backdrop-filter: blur(14px);
            padding: 2.25rem 2rem;
            border-radius: 2.5rem;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: min(35rem, 90vw);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-height: calc(100vh - 13rem); 
            margin-bottom: 8rem; 
            border: 0.1rem solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            z-index: 10;
            overflow: visible; 
            transition: background-color 0.8s ease, border-color 0.8s ease, max-height 0.6s ease, margin 0.6s ease;
        }

        /* Smart margin for portrait split screen */
        @media (max-aspect-ratio: 1/1), (max-width: 768px) {
            .dual-layout #viewContainer-0 {
                margin-bottom: 0; 
                max-height: calc(50vh - 2rem);
            }
            .dual-layout #viewContainer-1 {
                margin-bottom: 8rem; 
                max-height: calc(50vh - 6rem);
            }
        }

        .dark .status-container {
            background: rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .national-badge, .transition-banner {
            transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin 0.5s ease, padding 0.5s ease;
            opacity: 1;
            transform: translateY(0);
            max-height: 80px; 
            overflow: hidden;
        }
        .hidden-badge, .hidden-banner {
            opacity: 0;
            transform: translateY(-10px);
            max-height: 0;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            pointer-events: none;
        }

        .clock-digit {
            display: inline-block;
            width: 0.7em;
            text-align: center;
            transition: opacity 0.3s ease;
        }
        
        .clock-bubble {
            font-variant-numeric: tabular-nums;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .digit-change {
            animation: digitFade 0.35s ease-out;
        }

        @keyframes digitFade {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .alert-list-container {
            max-height: 0;
            opacity: 0;
            overflow-y: auto;
            flex: 1 1 auto; 
            min-height: 0;
            transition: max-height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
            margin-top: 0;
        }
        .alert-list-container.show {
            max-height: 35vh; 
            opacity: 1;
            margin-top: 0.5rem;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(1rem); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-item {
            animation: slideUpFade 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        @keyframes iconPop {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .icon-pop {
            animation: iconPop 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 0.35rem;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
        }

        /* Offline Modal Styles */
        #offlineModal {
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 100;
        }
        .modal-visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.99); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body id="mainBody" class="dark:text-white text-gray-900">

    <!-- Tailwind Safelist -->
    <div style="display: none;" class="bg-green-400 bg-orange-400 bg-red-500 bg-red-600/90 bg-orange-500/90 bg-green-700/80 border-red-400/50 border-orange-400/50 border-green-400/50 bg-red-950 bg-red-600 bg-orange-950 bg-orange-500 bg-green-950 bg-green-500 text-white"></div>

    <!-- Offline Modal Overlay -->
    <div id="offlineModal" class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-2xl modal-hidden">
        <div class="bg-black/80 border border-white/10 p-10 md:p-14 rounded-[3.5rem] text-center shadow-[0_2rem_5rem_rgba(0,0,0,0.6)] max-w-[90vw] animate-pulse-soft">
            <div class="flex justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="4.5rem" height="4.5rem" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h2 class="text-white text-3xl font-bold mb-3 tracking-tight">השרת אינו זמין</h2>
            <p class="text-white/70 text-lg font-medium leading-relaxed">
                מנסה להתחבר מחדש לנתוני פיקוד העורף...<br>
                אנא וודא חיבור תקין לאינטרנט ושהשרת רץ ברקע.
            </p>
        </div>
    </div>

    <!-- Fixed Global Controls -->
    <div class="fixed top-6 left-6 right-6 flex justify-between items-center z-50 pointer-events-none">
        <div class="flex gap-3 pointer-events-auto opacity-0"><div class="w-11 h-11"></div></div>
        <div class="flex gap-3 pointer-events-auto">
            <button onclick="toggleSplitScreen()" id="splitToggle" class="px-5 h-11 flex items-center gap-2 bg-black/40 dark:bg-white/10 hover:bg-black/60 dark:hover:bg-white/30 text-white rounded-xl transition shadow-xl border border-white/20 backdrop-blur-xl text-[0.75rem] font-bold uppercase tracking-widest active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.1rem" height="1.1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                <span id="splitText">פיצול מסך</span>
            </button>
            <button onclick="toggleDarkMode()" id="darkToggle" class="w-11 h-11 flex items-center justify-center bg-black/40 dark:bg-white/10 hover:bg-black/60 dark:hover:bg-white/30 text-white rounded-full transition shadow-xl border border-white/20 backdrop-blur-xl active:scale-95" title="שנה מצב תצוגה">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="1.4rem" height="1.4rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="1.4rem" height="1.4rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="3" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <!-- Main Dynamic Layout -->
    <div id="mainWrapper" class="single-layout"></div>

    <!-- Global Footer Stats -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none z-40">
        <div class="clock-bubble bg-black/85 backdrop-blur-3xl border border-white/10 px-14 py-6 rounded-[3rem] text-center shadow-[0_1rem_3rem_rgba(0,0,0,0.5)] min-w-[24rem] pointer-events-auto transition-all duration-500">
            <p class="text-white/60 text-[0.85rem] uppercase tracking-[0.4em] font-bold mb-2 text-center">שעת עדכון אחרון</p>
            <div class="text-white text-5xl md:text-6xl font-bold flex justify-center items-center" id="clockContainer" dir="ltr">
                <span class="clock-digit" id="h1">-</span>
                <span class="clock-digit" id="h2">-</span>
                <span class="mx-1">:</span>
                <span class="clock-digit" id="m1">-</span>
                <span class="clock-digit" id="m2">-</span>
                <span class="mx-1">:</span>
                <span class="clock-digit" id="s1">-</span>
                <span class="clock-digit" id="s2">-</span>
            </div>
        </div>
    </div>

    <script>
        const proxyBaseUrl = 'http://localhost:8080/?url=';
        const DATE_FORMAT_CONFIG = { dateStyle: 'short', timeStyle: 'medium' };

        const appState = {
            allCities: [],
            cityStatus: {}, 
            isSplit: false,
            isInitialLoad: true,
            isFetchingLocations: false, // Prevent multiple location fetches
            lastSuccessTime: Date.now(), // Track last successful communication
            views: [
                { id: 0, filter: '', lastVisualState: 'GREEN', lastTransition: null, simulation: null, _currentDisplayType: 'GREEN' },
                { id: 1, filter: '', lastVisualState: 'GREEN', lastTransition: null, simulation: null, _currentDisplayType: 'GREEN' }
            ]
        };

        const icons = {
            GREEN: `<svg xmlns="http://www.w3.org/2000/svg" width="5.5rem" height="5.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`,
            ORANGE: `<svg xmlns="http://www.w3.org/2000/svg" width="5.5rem" height="5.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4m0 4h.01"></path></svg>`,
            RED: `<svg xmlns="http://www.w3.org/2000/svg" width="5.5rem" height="5.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
        };

        const stateColors = { 'GREEN': 'bg-green-400', 'ORANGE': 'bg-orange-400', 'RED': 'bg-red-500' };

        // --- Optimized Fetch with Timeout ---
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 3000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        // --- Enhanced Connection Watchdog ---
        function setServerStatus(isSuccess) {
            if (isSuccess) {
                appState.lastSuccessTime = Date.now();
                // If we don't have cities yet (e.g., initial load failed), try again now that we're connected
                if (appState.allCities.length === 0 && !appState.isFetchingLocations) {
                    fetchLocations();
                }
            }
        }

        function monitorConnection() {
            const modal = document.getElementById('offlineModal');
            const timeSinceLastSuccess = Date.now() - appState.lastSuccessTime;
            
            // If more than 5 seconds passed without a successful fetch, show modal
            if (timeSinceLastSuccess > 5000) {
                modal.classList.remove('modal-hidden');
                modal.classList.add('modal-visible');
            } else {
                modal.classList.add('modal-hidden');
                modal.classList.remove('modal-visible');
            }
        }

        function parseDateSafely(rawDate) {
            if (!rawDate) return new Date().toLocaleString('he-IL', DATE_FORMAT_CONFIG);
            const d = new Date(rawDate.replace(' ', 'T'));
            if (!isNaN(d.getTime())) return d.toLocaleString('he-IL', DATE_FORMAT_CONFIG);
            return rawDate; 
        }

        function updateGlobalFavicon(type) {
            const iconEl = document.getElementById('appIcon');
            if (!iconEl) return;
            const colors = { 'GREEN': '#10b981', 'ORANGE': '#f97316', 'RED': '#ef4444' };
            const color = colors[type] || colors['GREEN'];
            const svgString = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='${color}' stroke='black' stroke-width='2'/></svg>`;
            iconEl.href = "data:image/svg+xml," + encodeURIComponent(svgString);
        }

        function initializeViews() {
            const wrapper = document.getElementById('mainWrapper');
            wrapper.innerHTML = '';
            [0, 1].forEach(index => {
                const html = `
                    <div id="viewHalf-${index}" class="view-half ${index === 1 && !appState.isSplit ? 'collapsed' : ''}">
                        <div id="viewContainer-${index}" class="status-container flex-shrink-0">
                            
                            <div id="transitionBanner-${index}" class="transition-banner flex flex-col items-center hidden-banner">
                                <div class="flex items-center gap-4 bg-black/40 dark:bg-white/10 px-5 py-2.5 rounded-full border border-white/20 scale-90">
                                    <div id="fromCircle-${index}" class="w-3.5 h-3.5 rounded-full shadow-sm"></div>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1.1rem" height="1.1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-white/80"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                    <div id="toCircle-${index}" class="w-3.5 h-3.5 rounded-full shadow-sm"></div>
                                    <span id="changeTime-${index}" class="mr-3 text-[1.05rem] font-medium text-white leading-none tracking-tight opacity-100"></span>
                                </div>
                                <div class="text-[0.85rem] mt-2 text-white uppercase tracking-[0.15em] font-medium opacity-100 drop-shadow-md">שינוי מצב אחרון</div>
                            </div>

                            <div id="nationalBadge-${index}" class="national-badge mb-1 inline-block px-4 py-2 rounded-full bg-white/10 dark:bg-white/5 text-white text-[1rem] self-center uppercase tracking-[0.15em] font-medium border border-white/5 shrink-0">מצב ארצי</div>

                            <div id="statusIcon-${index}" class="flex justify-center text-white transition-transform duration-500 shrink-0"></div>

                            <h1 id="statusTitle-${index}" class="font-bold text-white text-5xl tracking-tight leading-none shrink-0"></h1>
                            <p id="statusDesc-${index}" class="text-white text-2xl font-medium opacity-90 shrink-0"></p>
                            
                            <div class="mt-1 relative w-full shrink-0">
                                <input id="cityInput-${index}" type="text" oninput="handleInput(${index}, this.value)" onfocus="handleInput(${index}, this.value)" autocomplete="off" placeholder="הזן עיר או אזור" 
                                       class="w-full p-4 rounded-2xl text-gray-900 font-bold text-center bg-white/90 dark:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-blue-500/40 placeholder-gray-500 shadow-xl text-base transition-all duration-300 focus:scale-[1.02]">
                                <ul id="autocompleteList-${index}" class="absolute z-50 w-full bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden flex-col mt-2 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-700 custom-scroll top-full left-0"></ul>
                            </div>

                            <div id="alertList-${index}" class="alert-list-container w-full text-white text-right space-y-3 custom-scroll pr-4 mt-2"></div>

                            <div class="mt-auto pt-4 flex flex-col gap-4 w-full shrink-0">
                                <div class="flex justify-center gap-3">
                                    <button id="simRed-${index}" onclick="setSim(${index}, 'RED')" class="flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md hover:scale-[1.03] active:scale-95">סימולציית אזעקה</button>
                                    <button id="simOrange-${index}" onclick="setSim(${index}, 'ORANGE')" class="flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md hover:scale-[1.03] active:scale-95">סימולציית הנחיה מקדימה</button>
                                    <button id="simGreen-${index}" onclick="setSim(${index}, null)" class="flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md hover:scale-[1.03] active:scale-95">מצב ניטור</button>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', html);
            });
        }

        document.addEventListener('click', (e) => {
            [0, 1].forEach(index => {
                const listEl = document.getElementById(`autocompleteList-${index}`);
                const inputEl = document.getElementById(`cityInput-${index}`);
                if (listEl && inputEl && !listEl.contains(e.target) && e.target !== inputEl) {
                    listEl.classList.add('hidden');
                }
            });
        });

        function toggleSplitScreen() {
            appState.isSplit = !appState.isSplit;
            const wrapper = document.getElementById('mainWrapper');
            const view0 = document.getElementById('viewHalf-0');
            const view1 = document.getElementById('viewHalf-1');
            const toggleBtn = document.getElementById('splitToggle');
            const text = document.getElementById('splitText');

            if (appState.isSplit) {
                wrapper.classList.replace('single-layout', 'dual-layout');
                view1.classList.remove('collapsed');
                view0.classList.add('border-b-[3px]', 'md:border-b-0', 'md:border-l-[3px]', 'border-black/20', 'dark:border-white/10', 'shadow-[0_10px_20px_rgba(0,0,0,0.15)]', 'z-20');
                text.innerText = "ביטול פיצול";
                pollHistory(); 
            } else {
                wrapper.classList.replace('dual-layout', 'single-layout');
                view1.classList.add('collapsed');
                view0.classList.remove('border-b-[3px]', 'md:border-b-0', 'md:border-l-[3px]', 'border-black/20', 'dark:border-white/10', 'shadow-[0_10px_20px_rgba(0,0,0,0.15)]', 'z-20');
                text.innerText = "פיצול מסך";
            }
            refreshUI();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('moonIcon').classList.toggle('hidden', isDark);
            document.getElementById('sunIcon').classList.toggle('hidden', !isDark);
            refreshUI();
        }

        function getBgClass(type, isDark) {
            if (type === 'RED') return isDark ? 'bg-red-950' : 'bg-red-600';
            if (type === 'ORANGE') return isDark ? 'bg-orange-950' : 'bg-orange-500';
            return isDark ? 'bg-green-950' : 'bg-green-500';
        }

        function updateBtnStyle(id, isActive, activeClass) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.className = `flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md active:scale-95 ${isActive ? activeClass + ' ring-2 ring-white scale-105 z-10' : 'bg-black/25 hover:bg-black/35 border-white/5 opacity-50 hover:scale-[1.02]'}`;
        }

        function reconcileAlertList(container, displayCities) {
            const uniqueCities = [...new Set(displayCities)].sort((a, b) => a.localeCompare(b, 'he'));
            const currentCitiesInDom = new Set();
            
            Array.from(container.children).forEach(child => {
                const city = child.getAttribute('data-city');
                if (!uniqueCities.includes(city)) child.remove();
                else currentCitiesInDom.add(city);
            });

            uniqueCities.forEach((city, index) => {
                if (!currentCitiesInDom.has(city)) {
                    const div = document.createElement('div');
                    div.className = "alert-item bg-white/15 dark:bg-white/10 p-3.5 rounded-2xl shadow-md text-xl font-normal border border-white/5";
                    div.setAttribute('data-city', city);
                    div.innerText = city;
                    div.style.animationDelay = `${index * 0.03}s`;
                    const nextEl = Array.from(container.children).find(child => child.getAttribute('data-city').localeCompare(city, 'he') > 0);
                    if (nextEl) container.insertBefore(div, nextEl);
                    else container.appendChild(div);
                }
            });

            if (displayCities.length > 0) container.classList.add('show');
            else {
                container.classList.remove('show');
                setTimeout(() => { if (!container.classList.contains('show')) container.innerHTML = ''; }, 700);
            }
        }

        function updateViewDOM(index) {
            const view = appState.views[index];
            const container = document.getElementById(`viewContainer-${index}`);
            if (!container) return;

            let realType = 'GREEN', realCities = [], realTitle = "";
            const now = Date.now();
            const limitTime = now - (1000 * 60 * 180);
            for (const [cityName, state] of Object.entries(appState.cityStatus)) {
                if (state.time < limitTime) continue;
                if (!view.filter || cityName.includes(view.filter)) {
                    if (state.type === 'RED') { realType = 'RED'; realCities.push(cityName); realTitle = state.title; }
                    else if (state.type === 'ORANGE' && realType !== 'RED') { realType = 'ORANGE'; realCities.push(cityName); realTitle = state.title; }
                }
            }

            const stateChanged = realType !== view.lastVisualState;
            if (stateChanged) {
                view.lastTransition = { from: view.lastVisualState, to: realType, timestamp: new Date().toLocaleString('he-IL', DATE_FORMAT_CONFIG) };
                view.lastVisualState = realType;
            }

            let displayType = view.simulation ? view.simulation.type : realType;
            let displayCities = view.simulation ? view.simulation.cities : realCities;
            let displayTitle = view.simulation ? view.simulation.title : realTitle;
            view._currentDisplayType = displayType; 

            const isDark = document.documentElement.classList.contains('dark');
            const half = document.getElementById(`viewHalf-${index}`);
            if (half) {
                const targetBg = getBgClass(displayType, isDark);
                half.classList.remove('bg-red-950', 'bg-red-600', 'bg-orange-950', 'bg-orange-500', 'bg-green-950', 'bg-green-500'); 
                half.classList.add(...targetBg.split(' '));
            }

            const badge = document.getElementById(`nationalBadge-${index}`);
            if (badge) {
                if (view.filter) badge.classList.add('hidden-badge');
                else badge.classList.remove('hidden-badge');
            }

            const transBanner = document.getElementById(`transitionBanner-${index}`);
            if (view.lastTransition && view.lastTransition.from !== view.lastTransition.to) {
                if (transBanner) {
                    transBanner.classList.remove('hidden-banner');
                    document.getElementById(`fromCircle-${index}`).className = `w-3.5 h-3.5 rounded-full shadow-sm ${stateColors[view.lastTransition.from] || 'bg-gray-400'}`;
                    document.getElementById(`toCircle-${index}`).className = `w-3.5 h-3.5 rounded-full shadow-sm ${stateColors[view.lastTransition.to] || 'bg-gray-400'}`;
                    document.getElementById(`changeTime-${index}`).innerText = view.lastTransition.timestamp;
                }
            } else if (transBanner) transBanner.classList.add('hidden-banner');

            const iconEl = document.getElementById(`statusIcon-${index}`);
            if (iconEl) {
                const newIcon = icons[displayType];
                if (iconEl.innerHTML !== newIcon) {
                    iconEl.innerHTML = newIcon;
                    iconEl.classList.remove('icon-pop');
                    void iconEl.offsetWidth; 
                    iconEl.classList.add('icon-pop');
                }
            }

            const titleEl = document.getElementById(`statusTitle-${index}`);
            if (titleEl) titleEl.innerText = displayType === 'GREEN' ? (displayTitle || 'שגרה') : (displayType === 'RED' ? 'אזעקה!' : 'הנחיה מקדימה');

            reconcileAlertList(document.getElementById(`alertList-${index}`), displayCities);
            updateBtnStyle(`simRed-${index}`, view.simulation?.type === 'RED', 'bg-red-800/80 border-red-400/50');
            updateBtnStyle(`simOrange-${index}`, view.simulation?.type === 'ORANGE', 'bg-orange-600/80 border-orange-400/50');
            const realColor = realType === 'RED' ? 'bg-red-600/90' : (realType === 'ORANGE' ? 'bg-orange-500/90' : 'bg-green-700/80');
            updateBtnStyle(`simGreen-${index}`, !view.simulation, realColor);
        }

        function setSim(index, type) {
            appState.views[index].simulation = type === null ? null : { 
                type, 
                cities: ['יישוב סימולציה (עיר דגימה)', 'אזור תעשייה לדוגמה', 'שכונת המגורים'], 
                title: type === 'RED' ? 'ירי רקטות וטילים (סימולציה)' : 'צפויות הנחיות מקדימות (סימולציה)' 
            };
            refreshUI();
        }

        function selectCity(index, city) {
            const input = document.getElementById(`cityInput-${index}`);
            const listEl = document.getElementById(`autocompleteList-${index}`);
            if (input) input.value = city;
            if (listEl) listEl.classList.add('hidden');
            if (appState.views[index].filter !== city) {
                appState.views[index].filter = city;
                appState.views[index].lastVisualState = 'GREEN';
                appState.views[index].lastTransition = null;
                pollHistory();
                refreshUI();
            }
        }

        function handleInput(index, val) {
            const listEl = document.getElementById(`autocompleteList-${index}`);
            const trimmed = val.trim();
            if (listEl) {
                listEl.innerHTML = '';
                if (trimmed.length > 0) {
                    const matches = appState.allCities.filter(c => c.includes(trimmed)).slice(0, 20);
                    if (matches.length > 0) {
                        matches.forEach(m => {
                            const li = document.createElement('li');
                            li.className = "px-4 py-3 hover:bg-blue-50 dark:hover:bg-blue-900/30 cursor-pointer text-center font-medium transition-colors border-b border-gray-100 dark:border-gray-700 last:border-0";
                            li.innerText = m;
                            li.onclick = () => selectCity(index, m);
                            listEl.appendChild(li);
                        });
                        listEl.classList.remove('hidden');
                    } else listEl.classList.add('hidden');
                } else {
                    listEl.classList.add('hidden');
                    selectCity(index, "");
                }
            }
        }

        function refreshUI() {
            updateViewDOM(0);
            if (appState.isSplit) updateViewDOM(1);
            const v0 = appState.views[0]._currentDisplayType || 'GREEN';
            const v1 = appState.isSplit ? (appState.views[1]._currentDisplayType || 'GREEN') : 'GREEN';
            let global = 'GREEN';
            if (v0 === 'RED' || v1 === 'RED') global = 'RED';
            else if (v0 === 'ORANGE' || v1 === 'ORANGE') global = 'ORANGE';
            updateGlobalFavicon(global);
        }

        function parseAlertType(title, cat) {
            const t = title || ""; const c = String(cat);
            if (t.includes("הסתיים") || t.includes("חזרה לשגרה")) return "GREEN";
            if (c === "10" || c === "14" || t.includes("צפויות") || t.includes("מקדימה")) return "ORANGE";
            return "RED";
        }

        async function pollHistory() {
            try {
                const res = await fetchWithTimeout(proxyBaseUrl + encodeURIComponent('https://www.oref.org.il/warningMessages/alert/History/AlertsHistory.json?v=' + Date.now()));
                if (!res.ok) return;
                const data = await res.json();
                setServerStatus(true);
                
                appState.views.forEach((v) => {
                    if (appState.isInitialLoad || v.lastTransition === null) {
                        const relevant = data.filter(item => {
                            const cities = Array.isArray(item.data) ? item.data : String(item.data).split(',').map(s => s.trim());
                            return !v.filter || cities.some(c => c === v.filter); 
                        });

                        if (relevant.length > 0) {
                            const newest = relevant[0];
                            const newestType = parseAlertType(newest.title, newest.cat || newest.category);
                            
                            if (newestType === 'GREEN') {
                                const lastActive = relevant.find(item => parseAlertType(item.title, item.cat || item.category) !== 'GREEN');
                                if (lastActive) {
                                    v.lastTransition = { 
                                        from: parseAlertType(lastActive.title, lastActive.cat || lastActive.category), 
                                        to: 'GREEN', 
                                        timestamp: parseDateSafely(newest.alertDate || newest.date) 
                                    };
                                } else v.lastTransition = null;
                            } else {
                                v.lastTransition = { 
                                    from: 'GREEN', 
                                    to: newestType, 
                                    timestamp: parseDateSafely(newest.alertDate || newest.date) 
                                };
                            }
                            v.lastVisualState = newestType;
                        }
                    }
                });
                appState.isInitialLoad = false;
                [...data].reverse().forEach(item => {
                    if (!item.data) return;
                    const alertTime = new Date((item.date || item.alertDate).replace(' ', 'T')).getTime();
                    const type = parseAlertType(item.title, item.category || item.cat);
                    const citiesArray = Array.isArray(item.data) ? item.data : String(item.data).split(',').map(s => s.trim());
                    citiesArray.forEach(city => {
                        if (!appState.cityStatus[city] || alertTime >= appState.cityStatus[city].time) {
                            appState.cityStatus[city] = { type, title: item.title, time: alertTime };
                        }
                    });
                });
                refreshUI();
            } catch (e) { }
        }

        async function checkAlerts() {
            try {
                const res = await fetchWithTimeout(proxyBaseUrl + encodeURIComponent('https://www.oref.org.il/WarningMessages/alert/alerts.json?v=' + Date.now()));
                if (!res.ok) return;
                const text = await res.text();
                setServerStatus(true);
                if (!text || text.trim() === '' || text.trim() === '[]') return;
                let data = JSON.parse(text);
                const type = parseAlertType(data.title, data.cat);
                const now = Date.now();
                (data.data || []).forEach(city => { appState.cityStatus[city] = { type, title: data.title, time: now }; });
                refreshUI();
            } catch (e) { }
        }

        async function fetchLocations() {
            if (appState.isFetchingLocations) return;
            appState.isFetchingLocations = true;
            
            const urls = ['districts_heb.json', 'cities_heb.json'].map(f => `https://www.oref.org.il/districts/${f}`);
            let combined = new Set();
            let success = false;

            for (const url of urls) {
                try {
                    const res = await fetchWithTimeout(proxyBaseUrl + encodeURIComponent(url));
                    if (res.ok) {
                        const data = await res.json();
                        (Array.isArray(data) ? data : (data.districts || data.cities || [])).forEach(i => combined.add(i.mixname || i.label || i.value || i.name));
                        success = true;
                    }
                } catch (e) {}
            }
            
            if (success) {
                appState.allCities = Array.from(combined);
                setServerStatus(true);
            }
            
            appState.isFetchingLocations = false;
        }

        let lastTimeString = "";
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('he-IL', { hour12: false });
            if (timeString === lastTimeString) return;
            const ids = ['h1', 'h2', 'm1', 'm2', 's1', 's2'];
            const digits = timeString.replace(/:/g, '').split('');
            digits.forEach((digit, i) => {
                const el = document.getElementById(ids[i]);
                if (el.innerText !== digit) {
                    el.innerText = digit;
                    el.classList.remove('digit-change');
                    void el.offsetWidth; 
                    el.classList.add('digit-change');
                }
            });
            lastTimeString = timeString;
        }

        window.onload = () => {
            initializeViews();
            refreshUI(); 
            fetchLocations(); 
            pollHistory(); 
            checkAlerts();
            setInterval(checkAlerts, 1000); 
            setInterval(pollHistory, 5000);
            setInterval(updateClock, 100); 
            setInterval(monitorConnection, 500); // Watchdog every 500ms
        };
    </script>
</body>
</html>
