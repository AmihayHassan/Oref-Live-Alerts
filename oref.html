<!DOCTYPE html>
<html lang="he" dir="rtl" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצב התראות בזמן אמת</title>
    <!-- Dynamic Favicon Link -->
    <link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%2310b981' stroke='black' stroke-width='2'/%3E%3C/svg%3E">

    <!-- Google Fonts: Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        body {
            transition: background-color 0.8s ease, color 0.3s ease;
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
            overflow: hidden !important; touch-action: none;
            background-color: #111;
        }
        #mainWrapper { display: flex; flex-direction: row; width: 100%; height: 100vh; overflow: hidden; }
        @media (max-aspect-ratio: 1/1), (max-width: 768px) { #mainWrapper { flex-direction: column; } }

        .view-half {
            flex: 1 1 50%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 1.5rem; padding-top: 6vh; position: relative; height: 100%;
            transition: flex 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease, background-color 0.8s ease;
            overflow: hidden;
        }
        .view-half.collapsed { flex: 0 0 0%; opacity: 0; padding: 0; pointer-events: none; }

        .status-container {
            text-align: center; backdrop-filter: blur(14px); padding: 2.25rem 2rem; border-radius: 2.5rem;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.25); width: 100%; max-width: min(35rem, 90vw);
            position: relative; display: flex; flex-direction: column; gap: 1.25rem;
            max-height: 85vh;
            margin-bottom: 8rem; border: 0.1rem solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12); z-index: 10;
            overflow: visible;
            transition: background-color 0.8s ease, border-color 0.8s ease, max-height 0.6s ease, margin 0.6s ease;
        }

        @media (max-aspect-ratio: 1/1), (max-width: 768px) {
            .dual-layout #viewContainer-0 { margin-bottom: 0; max-height: calc(50vh - 2rem); }
            .dual-layout #viewContainer-1 { margin-bottom: 8rem; max-height: calc(50vh - 6rem); }
        }

        .dark .status-container { background: rgba(0, 0, 0, 0.35); border-color: rgba(255, 255, 255, 0.08); }

        .flex-fixed { flex-shrink: 0 !important; }

        .national-badge, .transition-banner {
            transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin 0.5s ease, padding 0.5s ease;
            opacity: 1; transform: translateY(0); max-height: 80px; overflow: hidden;
            flex-shrink: 0;
        }
        .hidden-badge, .hidden-banner {
            opacity: 0; transform: translateY(-10px); max-height: 0;
            margin: 0 !important; padding: 0 !important; pointer-events: none;
        }

        .clock-digit { display: inline-block; width: 0.7em; text-align: center; transition: opacity 0.3s ease; }
        .clock-bubble { font-variant-numeric: tabular-nums; border-color: rgba(255, 255, 255, 0.1); }
        .digit-change { animation: digitFade 0.35s ease-out; }
        @keyframes digitFade { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        .alert-list-container {
            max-height: 0; opacity: 0; overflow-y: auto; flex: 1 1 auto; min-height: 0;
            transition: max-height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
            margin-top: 0;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }
        .alert-list-container.show { max-height: 100%; opacity: 1; margin-top: 0.5rem; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
        .alert-item { animation: slideUpFade 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }

        @keyframes bannerSubtleUpdate {
            0% { transform: scale(0.9); opacity: 1; filter: brightness(1); }
            50% { transform: scale(0.94); opacity: 0.85; filter: brightness(1.2); }
            100% { transform: scale(0.9); opacity: 1; filter: brightness(1); }
        }
        .banner-update { animation: bannerSubtleUpdate 0.7s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes iconPop { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .icon-pop { animation: iconPop 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        .custom-scroll::-webkit-scrollbar { width: 0.35rem; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 1rem; }

        #offlineModal, #settingsModal { transition: opacity 0.4s ease, visibility 0.4s ease; z-index: 100; }
        .modal-visible { opacity: 1; visibility: visible; }
        .modal-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.99); } }
        .animate-pulse-soft { animation: pulse-soft 2.5s infinite ease-in-out; }

        .dot-glow-GREEN { filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.95)) !important; }
        .dot-glow-ORANGE { filter: drop-shadow(0 0 10px rgba(251, 146, 60, 0.95)) !important; }
        .dot-glow-RED { filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.95)) !important; }

        .clear-btn {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(0, 0, 0, 0.08); color: #4b5563;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; pointer-events: none; z-index: 20;
        }
        .clear-btn.visible { opacity: 1; pointer-events: auto; }
        .dark .clear-btn { background: rgba(255, 255, 255, 0.1); color: #d1d5db; }
        .clear-btn:hover { background: rgba(0, 0, 0, 0.15); color: #111; transform: translateY(-50%) scale(1.1); }
        .dark .clear-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

        .btn-header {
            display: flex; align-items: center; gap: 0.5rem; padding: 0 1.25rem;
            height: 2.75rem; border-radius: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            transition: all 0.25s ease; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(16px);
        }
        .dark .btn-header { background: rgba(255, 255, 255, 0.12); }
        .btn-header:hover { background: rgba(0, 0, 0, 0.6); transform: translateY(-1px); }
        .dark .btn-header:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body id="mainBody" class="dark:text-white text-gray-900">

    <div style="display: none;" class="bg-green-400 bg-orange-400 bg-red-500 bg-red-600/90 bg-orange-500/90 bg-green-700/80 border-red-400/50 border-orange-400/50 border-green-400/50 bg-red-950 bg-red-600 bg-orange-950 bg-orange-500 bg-green-950 bg-green-500 text-white"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-2xl modal-hidden z-[100]">
        <div class="bg-black/80 border border-white/10 p-10 md:p-12 rounded-[3.5rem] text-center shadow-[0_2rem_5rem_rgba(0,0,0,0.6)] w-full max-w-lg">
            <h2 class="text-white text-3xl font-bold mb-8 tracking-tight">הגדרות שרת</h2>
            <div class="text-right mb-6">
                <label class="text-white/60 text-sm font-bold uppercase tracking-wider block mb-2 mr-2">כתובת ה-Proxy (Host)</label>
                <input id="proxyInput" type="text" placeholder="localhost:8080"
                       class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 text-white text-xl font-medium focus:outline-none focus:ring-4 focus:ring-blue-500/30 transition-all text-left" dir="ltr">
                <p class="text-white/40 text-sm mt-3 leading-relaxed mr-2">הזן את כתובת ה-IP והפורט של שרת ה-Proxy שלך. ברירת המחדל היא localhost:8080.</p>
            </div>
            <div class="flex gap-4">
                <button onclick="saveSettings()" class="flex-1 py-4 bg-white text-black font-bold rounded-2xl hover:scale-105 active:scale-95 transition-all text-lg shadow-xl">שמור שינויים</button>
                <button onclick="toggleSettingsModal()" class="flex-1 py-4 bg-white/10 text-white font-bold rounded-2xl hover:bg-white/20 active:scale-95 transition-all text-lg border border-white/5">ביטול</button>
            </div>
        </div>
    </div>

    <!-- Offline Modal -->
    <div id="offlineModal" class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-2xl modal-hidden">
        <div class="bg-black/80 border border-white/10 p-10 md:p-14 rounded-[3.5rem] text-center shadow-[0_2rem_5rem_rgba(0,0,0,0.6)] max-w-[90vw] animate-pulse-soft">
            <div class="flex justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="4.5rem" height="4.5rem" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h2 class="text-white text-3xl font-bold mb-3 tracking-tight">השרת אינו זמין</h2>
            <p class="text-white/70 text-lg font-medium leading-relaxed">מנסה להתחבר מחדש לנתוני פיקוד העורף...<br>אנא וודא חיבור תקין לאינטרנט ושהשרת רץ ברקע.</p>
        </div>
    </div>

    <!-- Header Controls -->
    <div class="fixed top-6 left-6 right-6 flex justify-between items-center z-50 pointer-events-none">
        <div class="flex gap-3 pointer-events-auto opacity-0"><div class="w-11 h-11"></div></div>
        <div class="flex gap-3 pointer-events-auto">
            <button onclick="toggleSettingsModal()" class="btn-header !w-11 !px-0 justify-center !rounded-full" title="הגדרות">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.4rem" height="1.4rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <button onclick="toggleSplitScreen()" id="splitToggle" class="btn-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.1rem" height="1.1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                <span id="splitText">פיצול מסך</span>
            </button>
            <button onclick="toggleDarkMode()" id="darkToggle" class="btn-header !w-11 !px-0 justify-center !rounded-full">
                <!-- Indicating target state: Moon when currently light -->
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="1.4rem" height="1.4rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <!-- Indicating target state: Sun when currently dark -->
                <svg id="sunIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="1.4rem" height="1.4rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line> <!-- Fixed coordinates -->
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Main Dynamic Layout -->
    <div id="mainWrapper" class="single-layout"></div>

    <!-- Global Footer Stats -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none z-40">
        <div class="clock-bubble bg-black/85 backdrop-blur-3xl border border-white/10 px-14 py-6 rounded-[3rem] text-center shadow-[0_1rem_3rem_rgba(0,0,0,0.5)] min-w-[24rem] pointer-events-auto transition-all duration-500">
            <p class="text-white/60 text-[0.85rem] uppercase tracking-[0.4em] font-bold mb-2 text-center">שעת עדכון אחרון</p>
            <div class="text-white text-5xl md:text-6xl font-bold flex justify-center items-center" id="clockContainer" dir="ltr">
                <span class="clock-digit" id="h1">-</span><span class="clock-digit" id="h2">-</span><span class="mx-1">:</span>
                <span class="clock-digit" id="m1">-</span><span class="clock-digit" id="m2">-</span><span class="mx-1">:</span>
                <span class="clock-digit" id="s1">-</span><span class="clock-digit" id="s2">-</span>
            </div>
        </div>
    </div>

    <script>
        // --- Persistence Management ---
        let proxyHost = localStorage.getItem('oref_proxy_host') || "localhost:8080";
        const getProxyBaseUrl = () => `http://${proxyHost}/?url=`;

        const displayFormatter = new Intl.DateTimeFormat('he-IL', {
            year: 'numeric', month: 'numeric', day: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });

        const appState = {
            allCities: [], cityStatus: {}, cityEvents: {}, globalEvents: [],
            isSplit: false, isInitialLoad: true, isFetchingLocations: false, isFullHistoryLoaded: false,
            lastSuccessTime: Date.now(), lastLiveAlertJson: null, lastLiveAlertStartTime: null,
            views: [
                { id: 0, filter: '', lastVisualState: 'GREEN', lastTransition: null, simulation: null, _currentDisplayType: 'GREEN', _renderedTransition: null },
                { id: 1, filter: '', lastVisualState: 'GREEN', lastTransition: null, simulation: null, _currentDisplayType: 'GREEN', _renderedTransition: null }
            ]
        };

        const icons = {
            GREEN: `<svg xmlns="http://www.w3.org/2000/svg" width="5.5rem" height="5.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`,
            ORANGE: `<svg xmlns="http://www.w3.org/2000/svg" width="5.5rem" height="5.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4m0 4h.01"></path></svg>`,
            RED: `<svg xmlns="http://www.w3.org/2000/svg" width="5.5rem" height="5.5rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
        };

        const stateColors = { 'GREEN': 'bg-green-400', 'ORANGE': 'bg-orange-400', 'RED': 'bg-red-500' };

        function saveSettings() {
            const host = document.getElementById('proxyInput').value.trim() || "localhost:8080";
            proxyHost = host;
            localStorage.setItem('oref_proxy_host', host);
            toggleSettingsModal();
            // Fresh update using new host
            pollHistory();
            checkAlerts();
            fetchFullHistory();
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            document.getElementById('proxyInput').value = proxyHost;
            modal.classList.toggle('modal-hidden');
            modal.classList.toggle('modal-visible');
        }

        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id); return response;
            } catch (e) { clearTimeout(id); throw e; }
        }

        function setServerStatus(isSuccess) {
            if (isSuccess) {
                appState.lastSuccessTime = Date.now();
                if (appState.allCities.length === 0 && !appState.isFetchingLocations) fetchLocations();
                if (!appState.isFullHistoryLoaded) fetchFullHistory();
            }
        }

        function monitorConnection() {
            const modal = document.getElementById('offlineModal');
            if (Date.now() - appState.lastSuccessTime > 6000) {
                modal.classList.remove('modal-hidden'); modal.classList.add('modal-visible');
            } else {
                modal.classList.add('modal-hidden'); modal.classList.remove('modal-visible');
            }
        }

        function formatDisplayDate(rawDate) {
            if (!rawDate) return "-";
            const normalized = String(rawDate).includes(' ') && !String(rawDate).includes('T') ? String(rawDate).replace(' ', 'T') : rawDate;
            const d = new Date(normalized);
            return !isNaN(d.getTime()) ? displayFormatter.format(d) : rawDate;
        }

        function updateGlobalFavicon(type) {
            const iconEl = document.getElementById('appIcon'); if (!iconEl) return;
            const colors = { 'GREEN': '#10b981', 'ORANGE': '#f97316', 'RED': '#ef4444' };
            const svgString = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='${colors[type] || colors['GREEN']}' stroke='black' stroke-width='2'/%3E%3C/svg%3E`;
            iconEl.href = "data:image/svg+xml," + encodeURIComponent(svgString);
        }

        function initializeViews() {
            const wrapper = document.getElementById('mainWrapper');
            wrapper.innerHTML = '';
            [0, 1].forEach(index => {
                const html = `
                    <div id="viewHalf-${index}" class="view-half ${index === 1 && !appState.isSplit ? 'collapsed' : ''}">
                        <div id="viewContainer-${index}" class="status-container flex-shrink-0">
                            <div id="transitionBanner-${index}" class="transition-banner flex flex-col items-center hidden-banner flex-fixed">
                                <div id="bannerInner-${index}" class="flex items-center gap-4 bg-black/40 dark:bg-white/10 px-5 py-2.5 rounded-full border border-white/20 scale-[0.9]">
                                    <div id="fromCircle-${index}" class="w-3.5 h-3.5 rounded-full shadow-sm transition-all duration-500"></div>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1.1rem" height="1.1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-white/80"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                    <div id="toCircle-${index}" class="w-3.5 h-3.5 rounded-full shadow-sm transition-all duration-500"></div>
                                    <span id="changeTime-${index}" class="mr-3 text-[1.05rem] font-medium text-white leading-none tracking-tight transition-all duration-500"></span>
                                </div>
                                <div class="text-[0.85rem] mt-2 text-white uppercase tracking-[0.15em] font-medium opacity-100 drop-shadow-md">שינוי מצב אחרון</div>
                            </div>
                            <div id="nationalBadge-${index}" class="national-badge mb-1 inline-block px-4 py-2 rounded-full bg-white/10 dark:bg-white/5 text-white text-[1rem] self-center uppercase tracking-[0.15em] font-medium border border-white/5 flex-fixed">מצב ארצי</div>
                            <div id="statusIcon-${index}" class="flex justify-center text-white transition-transform duration-500 flex-fixed"></div>
                            <h1 id="statusTitle-${index}" class="font-bold text-white text-5xl tracking-tight leading-none flex-fixed"></h1>
                            <p id="statusDesc-${index}" class="text-white text-2xl font-medium opacity-90 flex-fixed shrink-0"></p>
                            <div class="mt-1 relative w-full flex-fixed">
                                <input id="cityInput-${index}" type="text" oninput="handleInput(${index}, this.value)" onfocus="handleInput(${index}, this.value)" autocomplete="off" placeholder="הזן עיר או אזור"
                                       class="w-full p-4 pl-12 rounded-2xl text-gray-900 font-bold text-center bg-white/90 dark:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-blue-500/40 placeholder-gray-500 shadow-xl text-base transition-all duration-300 focus:scale-[1.02]">
                                <button id="clearBtn-${index}" onclick="selectCity(${index}, '')" class="clear-btn" title="נקה חיפוש">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1.2rem" height="1.2rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                </button>
                                <ul id="autocompleteList-${index}" class="absolute z-50 w-full bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden flex-col mt-2 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-700 custom-scroll top-full left-0"></ul>
                            </div>
                            <div id="alertList-${index}" class="alert-list-container w-full text-white text-right space-y-3 custom-scroll pr-4 mt-2"></div>
                            <div class="mt-auto pt-4 flex flex-col gap-4 w-full flex-fixed">
                                <div class="flex justify-center gap-3">
                                    <button id="simRed-${index}" onclick="setSim(${index}, 'RED')" class="flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md hover:scale-[1.03] active:scale-95">סימולציית אזעקה</button>
                                    <button id="simOrange-${index}" onclick="setSim(${index}, 'ORANGE')" class="flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md hover:scale-[1.03] active:scale-95">סימולציית הנחיה מקדימה</button>
                                    <button id="simGreen-${index}" onclick="setSim(${index}, null)" class="flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md hover:scale-[1.03] active:scale-95">מצב ניטור</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', html);
            });
        }

        function toggleSplitScreen() {
            appState.isSplit = !appState.isSplit;
            const wrapper = document.getElementById('mainWrapper'), view0 = document.getElementById('viewHalf-0'), view1 = document.getElementById('viewHalf-1'), text = document.getElementById('splitText');
            if (appState.isSplit) {
                wrapper.classList.replace('single-layout', 'dual-layout'); view1.classList.remove('collapsed');
                view0.classList.add('border-b-[3px]', 'md:border-b-0', 'md:border-l-[3px]', 'border-black/20', 'dark:border-white/10', 'shadow-[0_10px_20px_rgba(0,0,0,0.15)]', 'z-20');
                text.innerText = "ביטול פיצול"; pollHistory();
            } else {
                wrapper.classList.replace('dual-layout', 'single-layout'); view1.classList.add('collapsed');
                view0.classList.remove('border-b-[3px]', 'md:border-b-0', 'md:border-l-[3px]', 'border-black/20', 'dark:border-white/10', 'shadow-[0_10px_20px_rgba(0,0,0,0.15)]', 'z-20');
                text.innerText = "פיצול מסך";
            }
            refreshUI();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('moonIcon').classList.toggle('hidden', isDark);
            document.getElementById('sunIcon').classList.toggle('hidden', !isDark);
            refreshUI();
        }

        function getBgClass(type, isDark) {
            if (type === 'RED') return isDark ? 'bg-red-950' : 'bg-red-600';
            if (type === 'ORANGE') return isDark ? 'bg-orange-950' : 'bg-orange-500';
            return isDark ? 'bg-green-950' : 'bg-green-500';
        }

        function updateBtnStyle(id, isActive, activeClass) {
            const btn = document.getElementById(id); if (!btn) return;
            btn.className = `flex-1 py-3 px-2 text-[0.95rem] text-white font-medium rounded-xl border transition-all duration-300 shadow-md active:scale-95 ${isActive ? activeClass + ' ring-2 ring-white scale-105 z-10' : 'bg-black/25 hover:bg-black/35 border-white/5 opacity-50 hover:scale-[1.02]'}`;
        }

        function reconcileAlertList(container, displayCities) {
            const uniqueCities = [...new Set(displayCities)].sort((a, b) => a.localeCompare(b, 'he')), currentCitiesInDom = new Set();
            Array.from(container.children).forEach(child => {
                const city = child.getAttribute('data-city');
                if (!uniqueCities.includes(city)) child.remove(); else currentCitiesInDom.add(city);
            });
            uniqueCities.forEach((city, index) => {
                if (!currentCitiesInDom.has(city)) {
                    const div = document.createElement('div');
                    div.className = "alert-item bg-white/15 dark:bg-white/10 p-3.5 rounded-2xl shadow-md text-xl font-normal border border-white/5";
                    div.setAttribute('data-city', city); div.innerText = city; div.style.animationDelay = `${index * 0.03}s`;
                    const nextEl = Array.from(container.children).find(child => child.getAttribute('data-city').localeCompare(city, 'he') > 0);
                    if (nextEl) container.insertBefore(div, nextEl); else container.appendChild(div);
                }
            });
            if (displayCities.length > 0) container.classList.add('show');
            else { container.classList.remove('show'); setTimeout(() => { if (!container.classList.contains('show')) container.innerHTML = ''; }, 700); }
        }

        function updateViewDOM(index) {
            const view = appState.views[index], container = document.getElementById(`viewContainer-${index}`);
            if (!container) return;

            let realType = 'GREEN', realCities = [], realTitle = "";
            for (const [cityName, state] of Object.entries(appState.cityStatus)) {
                if (state.type === 'GREEN') continue;
                if (!view.filter || cityName.includes(view.filter)) {
                    if (state.type === 'RED') { realType = 'RED'; realCities.push(cityName); realTitle = state.title; }
                    else if (state.type === 'ORANGE' && realType !== 'RED') { realType = 'ORANGE'; realCities.push(cityName); realTitle = state.title; }
                }
            }

            let newTransition = null;
            const events = view.filter ? (appState.cityEvents[view.filter] || []) : (appState.globalEvents || []);
            if (events.length > 0) {
                const latestEvent = events[0], latestType = latestEvent.type;
                const transitionFromEvent = events.find(e => e.type !== latestType);
                if (transitionFromEvent) newTransition = { from: transitionFromEvent.type, to: latestType, rawDate: latestEvent.rawDate };
                else if (latestType !== 'GREEN') newTransition = { from: 'GREEN', to: latestType, rawDate: latestEvent.rawDate };
                else if (latestType === 'GREEN') {
                    const prevActive = events.find(e => e.type !== 'GREEN');
                    if (prevActive) newTransition = { from: prevActive.type, to: 'GREEN', rawDate: latestEvent.rawDate };
                }
            }

            view.lastVisualState = realType;
            view.lastTransition = newTransition;

            let displayType = view.simulation ? view.simulation.type : realType, displayCities = view.simulation ? view.simulation.cities : realCities, displayTitle = view.simulation ? view.simulation.title : realTitle;
            view._currentDisplayType = displayType;

            const isDark = document.documentElement.classList.contains('dark'), half = document.getElementById(`viewHalf-${index}`);
            if (half) {
                const targetBg = getBgClass(displayType, isDark);
                half.classList.remove('bg-red-950', 'bg-red-600', 'bg-orange-950', 'bg-orange-500', 'bg-green-950', 'bg-green-500');
                half.classList.add(...targetBg.split(' '));
            }

            const badge = document.getElementById(`nationalBadge-${index}`);
            if (badge) { if (view.filter) badge.classList.add('hidden-badge'); else badge.classList.remove('hidden-badge'); }

            const clearBtn = document.getElementById(`clearBtn-${index}`);
            if (clearBtn) { if (view.filter) clearBtn.classList.add('visible'); else clearBtn.classList.remove('visible'); }

            const transBanner = document.getElementById(`transitionBanner-${index}`);
            const bannerInner = document.getElementById(`bannerInner-${index}`);
            if (newTransition && newTransition.from !== newTransition.to) {
                if (transBanner) {
                    const currentString = JSON.stringify(newTransition);
                    if (appState.views[index]._renderedTransition !== currentString) {
                        bannerInner.classList.remove('banner-update'); void bannerInner.offsetWidth;
                        bannerInner.classList.add('banner-update'); appState.views[index]._renderedTransition = currentString;
                    }
                    transBanner.classList.remove('hidden-banner');
                    document.getElementById(`fromCircle-${index}`).className = `w-3.5 h-3.5 rounded-full transition-all duration-500 ${stateColors[newTransition.from] || 'bg-gray-400'} dot-glow-${newTransition.from}`;
                    document.getElementById(`toCircle-${index}`).className = `w-3.5 h-3.5 rounded-full shadow-sm transition-all duration-500 ${stateColors[newTransition.to] || 'bg-gray-400'} dot-glow-${newTransition.to}`;
                    document.getElementById(`changeTime-${index}`).innerText = formatDisplayDate(newTransition.rawDate);
                }
            } else if (transBanner) { transBanner.classList.add('hidden-banner'); appState.views[index]._renderedTransition = null; }

            const iconEl = document.getElementById(`statusIcon-${index}`);
            if (iconEl) {
                const newIcon = icons[displayType];
                if (iconEl.innerHTML !== newIcon) { iconEl.innerHTML = newIcon; iconEl.classList.remove('icon-pop'); void iconEl.offsetWidth; iconEl.classList.add('icon-pop'); }
            }

            const titleEl = document.getElementById(`statusTitle-${index}`);
            if (titleEl) titleEl.innerText = displayType === 'GREEN' ? (displayTitle || 'שגרה') : (displayType === 'RED' ? 'אזעקה!' : 'הנחיה מקדימה');

            reconcileAlertList(document.getElementById(`alertList-${index}`), displayCities);
            updateBtnStyle(`simRed-${index}`, displayType === 'RED' && view.simulation, 'bg-red-800/80 border-red-400/50');
            updateBtnStyle(`simOrange-${index}`, displayType === 'ORANGE' && view.simulation, 'bg-orange-600/80 border-orange-400/50');
            const realColor = realType === 'RED' ? 'bg-red-600/90' : (realType === 'ORANGE' ? 'bg-orange-500/90' : 'bg-green-700/80');
            updateBtnStyle(`simGreen-${index}`, !view.simulation, realColor);
        }

        function setSim(index, type) {
            const cities = []; if (type) for (let i = 1; i <= 25; i++) cities.push(`יישוב סימולציה ${i}`);
            appState.views[index].simulation = type === null ? null : { type, cities, title: type === 'RED' ? 'ירי רקטות וטילים (סימולציה)' : 'צפויות הנחיות מקדימות (סימולציה)' };
            refreshUI();
        }

        function selectCity(index, city) {
            const input = document.getElementById(`cityInput-${index}`), listEl = document.getElementById(`autocompleteList-${index}`);
            if (input) input.value = city; if (listEl) listEl.classList.add('hidden');
            if (appState.views[index].filter !== city) {
                appState.views[index].filter = city; appState.views[index].lastVisualState = 'GREEN'; appState.views[index].lastTransition = null; refreshUI();
            } else if (city === '') { appState.views[index].filter = ''; refreshUI(); }
        }

        function handleInput(index, val) {
            const listEl = document.getElementById(`autocompleteList-${index}`), trimmed = val.trim(), clearBtn = document.getElementById(`clearBtn-${index}`);
            if (clearBtn) trimmed.length > 0 ? clearBtn.classList.add('visible') : clearBtn.classList.remove('visible');
            if (listEl) {
                listEl.innerHTML = '';
                if (trimmed.length > 0) {
                    const matches = appState.allCities.filter(c => c.includes(trimmed)).slice(0, 20);
                    if (matches.length > 0) {
                        matches.forEach(m => {
                            const li = document.createElement('li'); li.className = "px-4 py-3 hover:bg-blue-50 dark:hover:bg-blue-900/30 cursor-pointer text-center font-medium transition-colors border-b border-gray-100 dark:border-gray-700 last:border-0";
                            li.innerText = m; li.onclick = () => selectCity(index, m); listEl.appendChild(li);
                        });
                        listEl.classList.remove('hidden');
                    } else listEl.classList.add('hidden');
                } else { listEl.classList.add('hidden'); selectCity(index, ""); }
            }
        }

        function refreshUI() {
            updateViewDOM(0); if (appState.isSplit) updateViewDOM(1);
            const v0 = appState.views[0]._currentDisplayType || 'GREEN', v1 = appState.isSplit ? (appState.views[1]._currentDisplayType || 'GREEN') : 'GREEN';
            let global = 'GREEN'; if (v0 === 'RED' || v1 === 'RED') global = 'RED'; else if (v0 === 'ORANGE' || v1 === 'ORANGE') global = 'ORANGE';
            updateGlobalFavicon(global);
        }

        function parseAlertType(title, cat) {
            const t = title || "", c = String(cat);
            if (t.includes("הסתיים") || t.includes("חזרה לשגרה") || t.includes("סיום האירוע") || c === "13") return "GREEN";
            if (c === "10" || c === "14" || t.includes("צפויות") || t.includes("מקדימה")) return "ORANGE";
            return "RED";
        }

        function updateCityEventData(cities, type, title, rawDate) {
            const normalized = String(rawDate).includes(' ') && !String(rawDate).includes('T') ? String(rawDate).replace(' ', 'T') : rawDate;
            const timeMs = new Date(normalized).getTime(); if (isNaN(timeMs)) return;
            cities.forEach(city => {
                if (!city) return;
                if (!appState.cityStatus[city] || timeMs >= appState.cityStatus[city].time) appState.cityStatus[city] = { type, title, time: timeMs, rawDate };
                if (!appState.cityEvents[city]) appState.cityEvents[city] = [];
                if (!appState.cityEvents[city].some(e => e.time === timeMs)) {
                    appState.cityEvents[city].push({ type, time: timeMs, rawDate }); appState.cityEvents[city].sort((a, b) => b.time - a.time);
                    if (appState.cityEvents[city].length > 10) appState.cityEvents[city].length = 10;
                }
            });
            if (!appState.globalEvents.some(e => e.time === timeMs && e.type === type)) {
                appState.globalEvents.push({ type, time: timeMs, rawDate }); appState.globalEvents.sort((a, b) => b.time - a.time);
                if (appState.globalEvents.length > 30) appState.globalEvents.length = 30;
            }
        }

        async function fetchFullHistory() {
            if (appState.isFullHistoryLoaded) return;
            try {
                const res = await fetchWithTimeout(getProxyBaseUrl() + encodeURIComponent('https://alerts-history.oref.org.il//Shared/Ajax/GetAlarmsHistory.aspx?lang=he&fromDate=07.10.2023&toDate=&mode=0'), { timeout: 10000 });
                if (!res.ok) return;
                const data = await res.json(), reversed = [...data].reverse(), CHUNK_SIZE = 150;
                for (let i = 0; i < reversed.length; i += CHUNK_SIZE) {
                    const chunk = reversed.slice(i, i + CHUNK_SIZE);
                    chunk.forEach(item => {
                        const cities = String(item.data || item.city || "").split(',').map(s => s.trim());
                        updateCityEventData(cities, parseAlertType(item.title, item.category || item.cat), item.title, item.alertDate || item.date || item.datetime);
                    });
                    await new Promise(r => setTimeout(r, 0));
                }
                appState.isFullHistoryLoaded = true; refreshUI();
            } catch (e) {}
        }

        async function pollHistory() {
            try {
                const res = await fetchWithTimeout(getProxyBaseUrl() + encodeURIComponent('https://www.oref.org.il/warningMessages/alert/History/AlertsHistory.json?v=' + Date.now()));
                if (!res.ok) return;
                const data = await res.json(); setServerStatus(true);
                data.forEach(item => {
                    const cities = Array.isArray(item.data) ? item.data : String(item.data).split(',').map(s => s.trim());
                    updateCityEventData(cities, parseAlertType(item.title, item.category || item.cat), item.title, item.alertDate || item.date);
                });
                appState.isInitialLoad = false; refreshUI();
            } catch (e) {}
        }

        async function checkAlerts() {
            try {
                const res = await fetchWithTimeout(getProxyBaseUrl() + encodeURIComponent('https://www.oref.org.il/WarningMessages/alert/alerts.json?v=' + Date.now()));
                if (!res.ok) return;
                const text = await res.text(); setServerStatus(true);
                if (!text || text.trim() === '' || text.trim() === '[]') { appState.lastLiveAlertJson = null; appState.lastLiveAlertStartTime = null; return; }
                let data; try { data = JSON.parse(text); } catch(e) { return; }
                if (text === appState.lastLiveAlertJson && appState.lastLiveAlertStartTime) updateCityEventData(data.data || [], parseAlertType(data.title, data.cat), data.title, appState.lastLiveAlertStartTime);
                else { appState.lastLiveAlertJson = text; appState.lastLiveAlertStartTime = new Date().toISOString(); updateCityEventData(data.data || [], parseAlertType(data.title, data.cat), data.title, appState.lastLiveAlertStartTime); }
                refreshUI();
            } catch (e) {}
        }

        async function fetchLocations() {
            if (appState.isFetchingLocations) return; appState.isFetchingLocations = true;
            const urls = ['districts_heb.json', 'cities_heb.json'].map(f => `https://www.oref.org.il/districts/${f}`);
            let combined = new Set();
            for (const url of urls) {
                try {
                    const res = await fetchWithTimeout(getProxyBaseUrl() + encodeURIComponent(url));
                    if (res.ok) {
                        const data = await res.json();
                        (Array.isArray(data) ? data : (data.districts || data.cities || [])).forEach(i => combined.add(i.mixname || i.label || i.value || i.name));
                    }
                } catch (e) {}
            }
            appState.allCities = Array.from(combined); appState.isFetchingLocations = false;
        }

        let lastClockStr = "";
        function updateClock() {
            const now = new Date(), timeStr = now.toLocaleTimeString('he-IL', { hour12: false }).replace(/:/g, '');
            if (timeStr === lastClockStr) return;
            const ids = ['h1', 'h2', 'm1', 'm2', 's1', 's2'], digits = timeStr.split('');
            if (digits.length === 6) {
                digits.forEach((digit, i) => {
                    const el = document.getElementById(ids[i]);
                    if (el && el.innerText !== digit) { el.innerText = digit; el.classList.remove('digit-change'); void el.offsetWidth; el.classList.add('digit-change'); }
                });
            }
            lastClockStr = timeStr;
        }

        window.onload = () => {
            // Set initial proxy host to input
            document.getElementById('proxyInput').value = proxyHost;
            initializeViews(); refreshUI(); fetchLocations(); pollHistory(); checkAlerts();
            setInterval(checkAlerts, 1000); setInterval(pollHistory, 5000); setInterval(updateClock, 100); setInterval(monitorConnection, 500);
        };
    </script>
</body>
</html>
